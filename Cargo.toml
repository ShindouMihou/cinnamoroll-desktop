[package]
name = "cinnamoroll-desktop"
version = "0.3.0"
edition = "2024"
rust-version = "1.89"
description = "A tiny offline Cinnamoroll desktop companion"
license = "MIT"

[features]
updater = ["dep:self_update", "dep:tempfile", "dep:semver"]
bundled-sdl = ["sdl3/build-from-source"]

[dependencies]
self_update = { version = "=1.3.3", optional = true, default-features = false, features = ["ureq", "rustls", "github", "archive-zip", "compression-zip-deflate", "signatures", "checksums"] }
tempfile = { version = "3", optional = true }
semver = { version = "1", optional = true }
chrono = { version = "0.4", default-features = false, features = ["clock"] }
dirs = "6"
fastrand = "2"
fontdue = "0.9"
sdl3 = "0.20"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tiny-skia = "0.12"

[target.'cfg(target_os = "windows")'.dependencies]
windows-future = "0.3"
windows = { version = "0.62", features = ["Media_Control", "Foundation", "Foundation_Collections", "Win32_UI_Input_KeyboardAndMouse", "Win32_System_SystemInformation", "Win32_UI_Accessibility", "Win32_UI_WindowsAndMessaging", "Win32_System_Com", "Win32_System_Registry", "Win32_System_Threading", "Win32_System_Ole", "Win32_System_Variant", "Win32_Graphics_Gdi"] }

[build-dependencies]
serde_json = "1"

[target.'cfg(target_os = "macos")'.build-dependencies]
cc = "1"

[dev-dependencies]
zipsign-api = { version = "0.2.2", default-features = false, features = ["sign-zip", "verify-zip"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"

